# BicuSlicer as a Home Assistant add-on: the published image (with OrcaSlicer inside), opened from Home Assistant's
# sidebar. The image is ghcr.io/kylefutter97-prog/bicuslicer-ha:<version>, built by .github/workflows/docker.yml for
# every release tag; keep this version the same as the release (see docs/UPDATING.md).
name: BicuSlicer
version: "0.6.2"
slug: bicuslicer
description: Slice for your 3D printer in the browser, with OrcaSlicer's engine. Phone-friendly, sends to Klipper.
url: https://github.com/kylefutter97-prog/BicuSlicer
arch:
  - amd64
  - aarch64
image: ghcr.io/kylefutter97-prog/bicuslicer-ha
startup: application
boot: auto
ingress: true
ingress_port: 8000
ingress_stream: true
panel_icon: mdi:printer-3d
panel_title: BicuSlicer
ports:
  8000/tcp: null
ports_description:
  8000/tcp: "Direct access without Home Assistant, e.g. from phones (no login: trusted networks only). Off by default."
