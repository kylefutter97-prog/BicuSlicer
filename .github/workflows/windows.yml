# Builds the BicuSlicer Windows app (windows/build.ps1) and tests it before publishing: the built app's own Python
# runs the server the way the launcher does, which downloads OrcaSlicer for Windows on first start, and
# tools/smoke_test.py then slices for real and checks the G-code. Only if that passes is the installer attached to
# the GitHub release for the tag. Started by hand (Actions tab), it builds and tests without publishing: the installer
# is kept as a workflow artifact to try.
name: Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-test.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        shell: pwsh
        run: windows\build.ps1 -Version ${{ steps.v.outputs.version }}
      - name: HTTPS is checked by Windows itself (truststore, for downloads behind company proxies etc.)
        shell: pwsh
        run: |
          $m = build\BicuSlicer\python\python.exe -c "import ssl; print(type(ssl.create_default_context()).__module__)"
          Write-Host "SSL context from: $m"
          if ($m -notlike "truststore*") { Write-Output "::error title=truststore::the app's Python isn't using Windows' certificate checks ($m)"; exit 1 }
      - name: The launcher starts the server (self-test)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\appdata"
          build\BicuSlicer\python\python.exe build\BicuSlicer\launcher.pyw --selftest
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:LOCALAPPDATA\BicuSlicer\bicuslicer.log" -Tail 80; throw "launcher self-test failed" }
      # One step for the server and the smoke test: on Windows runners a process started in a step is stopped when
      # that step ends.
      - name: Start the built app's server (downloads OrcaSlicer for Windows) and smoke test it (real slices)
        shell: pwsh
        env:
          # the first start reads OrcaSlicer's file list from GitHub's API: shared runners hit the anonymous rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $data = "$env:RUNNER_TEMP\data"
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:DATA_DIR = $data; $env:ORCA_FETCH = "1"; $env:ORCA_VERSION = "2.5.2"; $env:ORCA_APP_DIR = "$env:RUNNER_TEMP\orca"
          $env:HOST = "127.0.0.1"; $env:PORT = "8000"; $env:PYTHONUNBUFFERED = "1"; $env:PYTHONUTF8 = "1"
          $server = Start-Process -FilePath build\BicuSlicer\python\python.exe -ArgumentList "build\BicuSlicer\app\server.py" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\server.log" -RedirectStandardError "$env:RUNNER_TEMP\server.err" -NoNewWindow -PassThru
          $deadline = (Get-Date).AddMinutes(25)
          do {
            Start-Sleep 10
            try { $s = Invoke-RestMethod http://127.0.0.1:8000/api/state; Write-Host "OrcaSlicer: $($s.orca.status) $($s.orca.progress) $($s.orca.error)" } catch { Write-Host "not answering yet" }
          } until (($s.orca.status -eq "ready") -or ($s.orca.status -eq "failed") -or ((Get-Date) -gt $deadline) -or $server.HasExited)
          if ($s.orca.status -ne "ready") {
            $srv = (Get-Content "$env:RUNNER_TEMP\server.log","$env:RUNNER_TEMP\server.err" -Tail 25 -ErrorAction SilentlyContinue) -join " / "
            Write-Output "::error title=OrcaSlicer setup::$($s.orca.status) $($s.orca.error) | server exited: $($server.HasExited) | $srv"
            exit 1
          }
          python tools\smoke_test.py --url http://127.0.0.1:8000 --wait 300 --report "$env:RUNNER_TEMP\smoke.md" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\smoke.out"
          $code = $LASTEXITCODE
          # failures as annotations: public on the run page and through GitHub's API, unlike the log
          Get-Content "$env:RUNNER_TEMP\smoke.out" | Where-Object { $_ -like "FAIL *" } | Select-Object -First 15 | ForEach-Object { Write-Output "::error title=Smoke test::$($_ -replace '[\r\n]', ' ')" }
          if ($code -ne 0) {
            Get-ChildItem "$data\jobs\*\meta.json" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
              $m = Get-Content $_ -Raw | ConvertFrom-Json
              $log = Join-Path $_.DirectoryName "slice.log"
              $tail = if (Test-Path $log) { (Get-Content $log -Tail 12) -join " / " } else { "(no slice.log)" }
              Write-Output "::error title=Job $($m.id) $($m.status)::error: $($m.error) | slice.log: $tail"
            }
            $srv = (Get-Content "$env:RUNNER_TEMP\server.log","$env:RUNNER_TEMP\server.err" -Tail 25 -ErrorAction SilentlyContinue) -join " / "
            Write-Output "::error title=Server log::server exited: $($server.HasExited) | $srv"
          }
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - name: Report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\smoke.md") { Get-Content "$env:RUNNER_TEMP\smoke.md" >> $env:GITHUB_STEP_SUMMARY }
          if (Test-Path "$env:RUNNER_TEMP\server.log") { Copy-Item "$env:RUNNER_TEMP\server.log","$env:RUNNER_TEMP\server.err" build\ -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BicuSlicer-Windows-${{ steps.v.outputs.version }}
          path: |
            build/BicuSlicer-Setup-*.exe
            build/server.log
            build/server.err
          if-no-files-found: warn
      - name: Attach the installer to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/BicuSlicer-Setup-*.exe
