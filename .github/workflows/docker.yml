# Builds the BicuSlicer image for amd64 and arm64 and publishes it to GitHub's container registry
# (ghcr.io/<owner>/bicuslicer). Runs when you push a version tag (v1.2.3) or start it by hand
# from the Actions tab; ordinary pushes don't build, to save Actions minutes.
name: Docker image

on:
  workflow_dispatch:
    inputs:
      orca_version:
        description: OrcaSlicer version to bundle
        default: "2.5.1"
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bicuslicer
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=orca-${{ inputs.orca_version || '2.5.1' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: ORCA_VERSION=${{ inputs.orca_version || '2.5.1' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
