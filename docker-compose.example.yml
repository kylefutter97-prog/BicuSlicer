services:
  bicuslicer:
    build: .
    image: bicuslicer:local
    container_name: bicuslicer
    user: "1000:1000"                 # must be able to read the OrcaSlicer folder and write ./data
    environment:
      TZ: Etc/UTC
      # Printers (Klipper/Moonraker, OctoPrint, PrusaLink, Duet) are added in the page: tap the printer pill.
    volumes:
      # Optional: an OrcaSlicer desktop data folder whose user presets you want to see, read-only.
      # With the linuxserver/orcaslicer desktop container this is <its /config>/.config/OrcaSlicer.
      # - /path/to/orcaslicer/config/.config/OrcaSlicer:/orca:ro
      - ./data:/data
      # - ./app:/app:ro                        # development: live code, restart to apply
    ports:
      - "8000:8000"                   # or drop this and reach it through your reverse proxy
    mem_limit: 4g
    restart: unless-stopped
