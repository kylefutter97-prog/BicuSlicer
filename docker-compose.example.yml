services:
  bicuslicer:
    build: .
    image: bicuslicer:local
    container_name: bicuslicer
    user: "1000:1000"                 # must be able to read the OrcaSlicer folder and write ./data
    environment:
      TZ: Etc/UTC
      MOONRAKER_URL: http://printer.local      # your Klipper host (Mainsail/Fluidd nginx or :7125)
      # MOONRAKER_API_KEY: ""                  # only if Moonraker doesn't trust this host
      # PRINTER_UI_URL: http://printer.local/  # defaults to the Moonraker host
    volumes:
      # OrcaSlicer data folder with your presets, read-only. With the linuxserver/orcaslicer desktop
      # container this is <its /config>/.config/OrcaSlicer.
      - /path/to/orcaslicer/config/.config/OrcaSlicer:/orca:ro
      - ./data:/data
      # - ./app:/app:ro                        # development: live code, restart to apply
    ports:
      - "8000:8000"                   # or drop this and reach it through your reverse proxy
    mem_limit: 4g
    restart: unless-stopped
